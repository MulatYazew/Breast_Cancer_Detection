# Breast Cancer CAD System — master configuration.
# Every stage (preprocessing, yolo, unet, resnet, inference, app) reads from
# this file via utils.config.load_config(). Partial overrides live under
# configs/ (e.g. configs/quick_run.yaml) and are deep-merged on top of this.

seed: 42
deterministic: true
device: null  # null = auto-select cuda > mps > cpu; or force "cuda" | "mps" | "cpu"

paths:
  raw_benign: dataset/BUSI_Jpeg/benign
  raw_benign_mask: dataset/BUSI_Jpeg/benign_mask
  raw_malignant: dataset/BUSI_Jpeg/malignant
  raw_malignant_mask: dataset/BUSI_Jpeg/malignant_mask
  splits_dir: dataset/splits
  yolo_dataset_dir: dataset/yolo_dataset
  checkpoints: checkpoints
  logs: logs
  results: results

split:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42

preprocessing:
  roi_size: [256, 256]          # unet/resnet ROI input size
  min_mask_area_px: 20          # discard connected components smaller than this
  bbox_pad_ratio: 0.08          # 8% padding around lesion bbox before crop

augmentation:
  # per-transform application probability bands, see preprocessing/augmentation.py
  safe_prob: 0.4
  cautious_prob: 0.3
  yolo:
    use_cautious_set: true
    use_elastic: true
    elastic_alpha: 20
    elastic_sigma: 5
  unet:
    use_cautious_set: true
    use_elastic: true
    elastic_alpha: 15
    elastic_sigma: 4
  resnet:
    use_cautious_set: false
    use_elastic: false

yolo:
  weights: yolo26n.pt
  imgsz: 640
  epochs: 150
  batch: 16
  patience: 20          # early stopping patience (epochs)
  lr0: 0.01
  optimizer: auto
  amp: true             # mixed precision
  workers: 4
  project: checkpoints/yolo
  name: busi_tumor
  resume: false
  class_names: [tumor]

unet:
  architecture: unet          # unet | unetpp | attention_unet
  encoder: resnet34           # resnet34 | efficientnet-b0 | efficientnet-b3
  encoder_weights: imagenet
  in_channels: 3
  classes: 1
  epochs: 100
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  patience: 15
  amp: true
  loss:
    dice_weight: 0.5
    bce_weight: 0.5
    focal_weight: 0.0
    focal_gamma: 2.0
  scheduler:
    type: plateau           # plateau | cosine
    factor: 0.5
    patience: 5
  checkpoint_dir: checkpoints/unet
  checkpoint_name: best_unet.pth

resnet:
  pretrained: true
  num_classes: 2
  class_names: [benign, malignant]
  freeze_backbone_epochs: 5   # linear-probe warmup before unfreezing
  epochs: 60
  batch_size: 32
  lr: 1.0e-4
  fine_tune_lr: 1.0e-5
  weight_decay: 1.0e-4
  patience: 12
  amp: true
  label_smoothing: 0.05
  checkpoint_dir: checkpoints/resnet
  checkpoint_name: best_resnet.pth

inference:
  yolo_weights: checkpoints/yolo/busi_tumor/weights/best.pt
  unet_weights: checkpoints/unet/best_unet.pth
  resnet_weights: checkpoints/resnet/best_resnet.pth
  conf_threshold: 0.25
  iou_threshold: 0.45

debug:
  quick_run: false   # see configs/quick_run.yaml for the smoke-test override

# Stage 6: structured BI-RADS report (reporting/ package, Stage 6 panel in app.py).
# Needs `pip install -r requirements-reporting.txt`; without it the app still
# runs and the Stage 6 section shows a short notice instead.
reporting:
  enabled: true
  backend: local              # local | hf_api | off ("off" = app behaves exactly as before Stage 6)
  llm:
    # Qwen2.5-3B-Instruct is under the Qwen RESEARCH license (non-commercial
    # only). Apache-2.0 alternatives: Qwen/Qwen2.5-1.5B-Instruct (faster, CPU-friendly)
    # or Qwen/Qwen2.5-7B-Instruct (better, needs GPU locally / good for hf_api).
    model_id: Qwen/Qwen2.5-3B-Instruct
    api_model_id: Qwen/Qwen2.5-3B-Instruct   # used when backend = hf_api
    max_new_tokens: 900
    temperature: 0.2
    timeout_s: 120              # hf_api request timeout
    max_retries: 2              # extra attempts after a schema-validation failure
  embedding_model_id: sentence-transformers/all-MiniLM-L6-v2
  knowledge_dir: reporting/knowledge
  index_dir: results/reporting/index   # case index built by `python -m reporting.build_index`
  top_k_knowledge: 6
  top_k_cases: 5
  # Stage 6's descriptors are heuristic estimates and its BI-RADS category is an
  # unvalidated rule proposal (BUSI has no BI-RADS labels). Keep it hidden by
  # default; the clinician can reveal it per case with an explicit toggle.
  show_rule_category: false

# BI-RADS-aware research workflow (notebooks/01-06, runtime in bus_research/).
# Needs `pip install -r requirements-research.txt`; without it the app shows a
# short notice in the "Quantitative analysis (research)" panel and nothing else changes.
research:
  radiomics:
    output_dir: results/radiomics
    bin_width: 8                 # 8-bit B-mode -> at most 32 gray levels
    feature_classes: [shape2D, firstorder, glcm, glrlm, glszm, gldm, ngtdm]
    image_types: [Original]      # no wavelet/LoG: ~8x more features on ~450 training lesions, LoG sigma needs mm
    normalize: false
    resampled_pixel_spacing: null   # no resampling; BUSI has no physical spacing -> pixel units
    interpolator: sitkBSpline
    label: 1
    keep_largest_component: true
    qc:
      min_area_px: 50
      max_area_fraction: 0.6
      min_largest_component_fraction: 0.9
  models:
    output_dir: results/models
    classifier_dir: results/models/radiomics_classifier
  rag:
    index_dir: results/rag/index
    chunk_words: 120
    chunk_overlap_words: 30
    top_k: 5
    embedding_model_id: null     # BM25 only (deterministic); e.g. sentence-transformers/all-MiniLM-L6-v2 for hybrid
    forbidden_dirs: [results, dataset/splits, dataset/yolo_dataset]   # never index case data or labels
    sources:
      - id: birads-card
        kind: pdf
        path: "dataset/BUSI_Jpeg/BIRADS Reference Card (1).pdf"
        title: ACR BI-RADS Atlas Fifth Edition — Quick Reference
        citation: "American College of Radiology. ACR BI-RADS Atlas, 5th ed. Quick Reference card (07.15)."
        version: "5th edition (card dated 07.15)"
        url: https://www.acr.org/birads
        evidence_tier: primary_reference
        license_note: Provided with the project; the full Atlas is NOT available to this system.
      - id: pyradiomics-docs
        kind: python_docstrings
        modules: [radiomics.shape2D, radiomics.firstorder, radiomics.glcm, radiomics.glrlm, radiomics.glszm,
                  radiomics.gldm, radiomics.ngtdm]
        title: PyRadiomics feature definitions
        citation: "van Griethuysen JJM et al. Computational Radiomics System to Decode the Radiographic Phenotype. Cancer Res. 2017;77(21):e104-e107. Feature docs from the installed package."
        version: null            # filled from radiomics.__version__ at ingestion
        url: https://pyradiomics.readthedocs.io
        evidence_tier: official_documentation
      - id: project-us-lexicon-notes
        kind: markdown
        path: reporting/knowledge/us_lexicon.md
        title: Project notes — BI-RADS US lexicon paraphrase (Stage 6)
        citation: Project-authored paraphrase; not verified against the full ACR Atlas.
        version: null
        url: null
        evidence_tier: secondary_project_notes
      - id: project-category-notes
        kind: markdown
        path: reporting/knowledge/assessment_categories.md
        title: Project notes — BI-RADS assessment categories paraphrase (Stage 6)
        citation: Project-authored paraphrase; likelihood ranges not verified against the full ACR Atlas.
        version: null
        url: null
        evidence_tier: secondary_project_notes
  reports:
    output_dir: results/reports/research
    llm_backend: stub            # stub (offline, deterministic) | local (reporting.llm.model_id) | hf_api
    allow_external_llm: false    # hf_api sends the de-identified payload off-machine; must be explicitly true
    max_retries: 2
